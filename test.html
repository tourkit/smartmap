<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chmaartmaarp</title>

<style>
body {
  margin:0;
  background:#0b0f14;
  color:#cfe3ff;
  font-family:monospace;
  overflow:hidden;
}

* {
  user-select: none;
  -webkit-user-select: none;
}

header {
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #1f2a3a;
}

canvas {
  position:absolute;
  left:0;
}

#gl {
  top:60px;
}

#text {
  top:60px;
  pointer-events:none;
}

#tooltip {
  position:absolute;
  background:#111826;
  border:1px solid #2a3a50;
  padding:6px;
  font-size:12px;
  pointer-events:none;
  display:none;
}

.error {

  background-color: #000;
  color: #ff0000;
  text-align: center;
  font-size: 28px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <label>Size:</label>
  <input id="size" type="number" value="5000" max="100000"/>

  <label>W:</label>
  <input id="w" type="range" min="10" max="80" value="24"/>

  <label>H:</label>
  <input id="h" type="range" min="20" max="60" value="34"/>
  
  <label>speed:</label>
  <input id="speed" type="range" min="1" max="1000" value="100"/>
  <label>speedb:</label>
  <input id="speedb" type="range" min="1" max="1000" value="100"/>

  <button id="apply">apply</button>
</header>

<canvas id="gl"></canvas>
<canvas id="text"></canvas>
<div id="tooltip"></div>

<script src="/js/fingerprint.js"></script>

<script>
const glCanvas = document.getElementById("gl");
const textCanvas = document.getElementById("text");
const tooltip = document.getElementById("tooltip");

const gl = glCanvas.getContext("webgl2");
if (!gl) {
  str = "<h1>WEBGL REQUIRED</h1><br/>(icon on the left of the url bar)"
  body = document.getElementsByTagName("body")[0]

  body.className = "error"

  body.innerHTML = str;
  throw new Error(str);

}
const tctx = textCanvas.getContext("2d");

let W,H;
function resize(){
  W = window.innerWidth;
  H = window.innerHeight - 60;

  for (const c of [glCanvas, textCanvas]) {
    c.width = W;
    c.height = H;
    c.style.top = "60px";
  }

  gl.viewport(0,0,W,H);
}
window.onresize = resize;
resize();

// ---------------- DATA ----------------
let N = 200;
let buf = new Uint8Array(N);

let cellW = 24;
let cellH = 34;
let cols = 1;

function computeLayout(){
  cols = Math.floor(W / cellW);
  cols = Math.max(5, cols);
}

// ---------------- WEBGL SHADERS ----------------
const vs = `#version 300 es
in vec2 a_quad;
in vec2 a_pos;
in vec2 a_size;
in float a_val;

uniform vec2 u_res;

out float v_val;
out vec2 v_uv;

void main(){
  vec2 pos = floor(a_pos + 0.5);
  vec2 size = a_size;

  vec2 offset = a_quad * size;
  vec2 pixelPos = pos + offset;

  vec2 zeroToOne = pixelPos / u_res;
  vec2 clip = zeroToOne * 2.0 - 1.0;

  clip.y = -clip.y;

  gl_Position = vec4(clip, 0, 1);

  v_val = a_val;
  v_uv = a_quad;
}
`;

const fs = `#version 300 es
precision highp float;

in float v_val;
in vec2 v_uv;
out vec4 outColor;

void main(){
  float v = v_val / 255.0;

  vec3 base = vec3(0.06,0.09,0.13);
  vec3 bar  = vec3(0.23,0.62,1.0);

  outColor = vec4(mix(base, bar, v), 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ---------------- BUFFERS ----------------
const quadBuf = gl.createBuffer();
const posBuf = gl.createBuffer();
const sizeBuf = gl.createBuffer();
const valBuf = gl.createBuffer();

const a_quad = gl.getAttribLocation(prog, "a_quad");
const a_pos = gl.getAttribLocation(prog, "a_pos");
const a_size = gl.getAttribLocation(prog, "a_size");
const a_val = gl.getAttribLocation(prog, "a_val");

const u_res = gl.getUniformLocation(prog, "u_res");

const quadData = new Float32Array([
  0, 0,
  1, 0,
  0, 1,
  1, 1,
]);

// ---------------- DRAW ----------------
function drawGL(){

  const pos = new Float32Array(N * 2);
  const size = new Float32Array(N * 2);
  const val = new Float32Array(N);

  for(let i=0;i<N;i++){
    const x = Math.floor(i % cols) * cellW;
    const y = Math.floor(i / cols) * cellH;

    pos[i*2]   = x;
    pos[i*2+1] = y;

    size[i*2] = cellW;
    size[i*2+1] = cellH;

    val[i] = buf[i];
  }

  gl.clearColor(0.05,0.07,0.1,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(u_res, W, H);

  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, quadData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(a_quad);
  gl.vertexAttribPointer(a_quad,2,gl.FLOAT,false,0,0);
  gl.vertexAttribDivisor(a_quad, 0);

  gl.enableVertexAttribArray(a_pos);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(a_pos,2,gl.FLOAT,false,0,0);
  gl.vertexAttribDivisor(a_pos, 1);

  gl.enableVertexAttribArray(a_size);
  gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, size, gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(a_size,2,gl.FLOAT,false,0,0);
  gl.vertexAttribDivisor(a_size, 1);

  gl.enableVertexAttribArray(a_val);
  gl.bindBuffer(gl.ARRAY_BUFFER, valBuf);
  gl.bufferData(gl.ARRAY_BUFFER, val, gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(a_val,1,gl.FLOAT,false,0,0);
  gl.vertexAttribDivisor(a_val, 1);

  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
}

// ---------------- TEXT LAYER (IDENTIQUE VISUEL) ----------------
function drawText(){
tctx.setTransform(1,0,0,1,0,0);
tctx.clearRect(0,0,W,H);
  tctx.font = "10px monospace";
  tctx.textAlign = "center";
tctx.textBaseline = "middle";
  for(let i=0;i<N;i++){
    const x = (i % cols) * cellW;
    const y = Math.floor(i / cols) * cellH;

    const v = buf[i];

    const cx = x + cellW/2;
    const cy = y + cellH/2;

    tctx.fillStyle = "#cfe3ff";
    tctx.fillText(i, cx, cy - cellH*0.25);

    tctx.fillStyle = "#7fb8ff";
    tctx.fillText(v, cx, cy + cellH*0.25);
  }
  
}

function draw(){
  drawGL();
  drawText();
}

// ---------------- INTERACTION ----------------
let dragging = false;

glCanvas.addEventListener("mousedown", ()=>dragging=true);
window.addEventListener("mouseup", ()=>dragging=false);

function getIndex(x,y){
  const cx = Math.floor(x / cellW);
  const cy = Math.floor(y / cellH);
  return cy * cols + cx;
}

glCanvas.addEventListener("mousemove", e=>{
  const r = glCanvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  const i = getIndex(x,y);

  if(i>=0 && i<N){
    tooltip.style.display="block";
    tooltip.style.left=e.clientX+10+"px";
    tooltip.style.top=e.clientY+10+"px";

    tooltip.innerHTML = "id: " + i + "<br>value: " + buf[i];

    if(dragging){
      const localY = (y % cellH);
      const v = 1 - localY / cellH;
      buf[i] = Math.max(0, Math.min(255, v * 255));
      draw();
    }
  } else {
    tooltip.style.display="none";
  }
});

// ---------------- SIMULATION ----------------
//setInterval(()=>{
//  for(let i=0;i<N;i++){
//    buf[i] = (Math.sin(i*0.02 + Date.now()*0.002)+1)*127;
//  }
//  draw();
//}, 50);

// ---------------- UI ----------------
document.getElementById("w").oninput = e=>{
  cellW = +e.target.value;
  computeLayout();
  draw();
};

document.getElementById("h").oninput = e=>{
  cellH = +e.target.value;
  computeLayout();
  draw();
}

document.getElementById("speed").oninput = e=>{

  const buffer = new ArrayBuffer(1 + 4); // 1 byte + 32-bit int
  const view = new DataView(buffer);
  
  view.setUint8(0, 0);     // 1 byte
  view.setInt32(1, e.target.value, true); // int32 little-endian
  
  ws.send(buffer);

};

document.getElementById("speedb").oninput = e=>{

  const buffer = new ArrayBuffer(1 + 4); // 1 byte + 32-bit int
  const view = new DataView(buffer);
  
  view.setUint8(0, 1);     // 1 byte
  view.setInt32(1, e.target.value, true); // int32 little-endian
  
  ws.send(buffer);

};

document.getElementById("apply").onclick=()=>{
  N = +document.getElementById("size").value;
  buf = new Uint8Array(N);
  computeLayout();
  draw();
};
const ws = new WebSocket("ws://localhost:1337");
ws.binaryType = "arraybuffer";

ws.onmessage = (event) => {

  //if (event.)

  buf = new Uint8Array(event.data)
  N = buf.length

  computeLayout();

  draw();

};
</script>

</body>
</html>
